name: sonarQube
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
      
    # UPDATED: Added 'libgdiplus' which is required for processing Resources/Images on Linux
    - name: Install dependencies (curl, wget, libssl1.1, libgdiplus)
      run: |
        apt-get update
        apt-get install curl wget libssl1.1 libgdiplus -y 
        
    - name: Install Java for Embold & SonarScanner
      run: |
        apt-get install openjdk-17-jre -y 
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install SonarScanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        
    - name: SonarScanner Begin
      # Note: Consider using secrets for tokens in production
      run: dotnet sonarscanner begin /k:"vcatest_ShareX" /o:"vcatest" /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e" /d:sonar.host.url="https://sonarcloud.io/"
      
    # NEW: Fix Windows-style paths in .resx files to prevent MSB3103 errors on Linux
    - name: Patch .resx files for Linux
      run: |
        find . -name "*.resx" -type f -exec sed -i 's/\\/\//g' {} +

    # NEW: Build command with flags to bypass Windows restrictions
    - name: Build Project
      # -p:EnableWindowsTargeting=true -> Forces the build to run on Linux
      # -p:PostBuildEvent= -> Disables 'xcopy' and other Windows-only post-build commands
      run: dotnet build -p:EnableWindowsTargeting=true -p:PostBuildEvent=
      
    - name: SonarScanner End
      run: dotnet sonarscanner end /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e"

