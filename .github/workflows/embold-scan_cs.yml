name: .NET

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (curl, wget, libssl1.1)
      run: |
        apt-get update
        apt-get install curl wget libssl1.1 -y 
    
    - name: Install Java for Embold Scanner
      run: |
        apt-get install openjdk-11-jre -y
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # ShareX uses .NET 8
        
    # NEW STEP: Attempt Linux Build
    # We use '|| true' to ignore errors because ShareX requires Windows to fully build.
    # This ensures dependencies are restored for analysis, but prevents the workflow from failing.
    - name: Build ShareX (Linux compatibility mode)
      run: |
        echo "Restoring dependencies..."
        dotnet restore ShareX.sln || true
        
        echo "Building solution..."
        dotnet build ShareX.sln --configuration Release || echo "Build incomplete due to platform mismatch, proceeding to analysis..."

    - name: Embold Analyse
      run: |
        curl  ${{ vars.EMBOLD_SCANNER_URL}} -o browserstack-codequality-scanner-archive.tar.gz
        tar xvf browserstack-codequality-scanner-archive.tar.gz
        echo "Download and extract BrowserStack CQ Scanner done"
        curl --silent --location --request GET "${{ vars.EMBOLD_URL_CS}}/api/v1/repositories/e0301195ef5797f8c2bdd162430706ee/scans/config/download" --header "Authorization:Bearer ${{ secrets.EMBOLD_TOKEN_CS}}" -o repository-configuration.json
        echo "Download repository configuration file done"
        ./browserstack-codequality-scanner/bin/embold-scanner analyse -u ${{ vars.EMBOLD_URL_CS}} -t ${{ secrets.EMBOLD_TOKEN_CS}} -r e0301195ef5797f8c2bdd162430706ee -b . -d ./embold-data -c ./repository-configuration.json -v
