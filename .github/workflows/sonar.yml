name: .NET
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
      
    - name: Install dependencies (curl, wget, libssl1.1)
      run: |
        apt-get update
        apt-get install curl wget libssl1.1 -y 

    ## FIX 1: Mock xcopy so the build doesn't fail on Linux
    - name: Mock Windows Commands (xcopy)
      run: |
        echo '#!/bin/bash' > /usr/bin/xcopy
        echo 'echo "Mock xcopy: Ignoring file copy on Linux"' >> /usr/bin/xcopy
        chmod +x /usr/bin/xcopy

    - name: Install Java for Embold & SonarScanner
      run: |
        apt-get install openjdk-17-jre -y 
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install SonarScanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        
    - name: SonarScanner Begin
      run: dotnet sonarscanner begin /k:"vcatest_ShareX" /o:"vcatest" /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e" /d:sonar.host.url="https://sonarcloud.io/"

    ## FIX 2: Patch file path casing (Folder AND File)
    - name: Fix Case Sensitivity (Resx and Files)
      run: |
        # 1. Fix Directory Path in .resx: Change 'resources\' to 'Resources\'
        sed -i 's/resources\\/Resources\\/g' ShareX.UploadersLib/Properties/Resources.resx
        
        # 2. Fix File Casing: Find "OAuthCallbackPage.html" (any case) and rename to lowercase
        find ShareX.UploadersLib/Resources -depth -iname "oauthcallbackpage.html" -exec mv {} ShareX.UploadersLib/Resources/oauthcallbackpage.html \;
        
        # 3. Fix Favicons Casing: Rename the 'Favicons' directory and ALL its files to lowercase
        if [ -d "ShareX.UploadersLib/Favicons" ]; then mv ShareX.UploadersLib/Favicons ShareX.UploadersLib/favicons; fi
        if [ -d "ShareX.UploadersLib/favicons" ]; then
          find ShareX.UploadersLib/favicons -depth -type f | while read f; do 
            dir=$(dirname "$f")
            base=$(basename "$f")
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')
            if [ "$base" != "$lower" ]; then
              mv "$f" "$dir/$lower"
            fi
          done
        fi
        
    - name: Build Project
      run: dotnet build -p:EnableWindowsTargeting=true
      
    - name: SonarScanner End
      run: dotnet sonarscanner end /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e"
