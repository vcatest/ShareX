name: .NET
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    # CHANGED: Use Windows runner to support 'xcopy' and Windows Resources
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # NEW: Use the official action to install Java (Works on Windows & Linux)
    # Replaces 'apt-get install openjdk-17-jre'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install SonarScanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        
    - name: SonarScanner Begin
      # Note: Consider using ${{ secrets.SONAR_TOKEN }} instead of hardcoding the token
      run: dotnet sonarscanner begin /k:"vcatest_ShareX" /o:"vcatest" /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e" /d:sonar.host.url="https://sonarcloud.io/"
      
    - name: Build Project
      # On Windows, we don't need the EnableWindowsTargeting flag or PostBuildEvent overrides
      run: dotnet build
      
    - name: SonarScanner End
      run: dotnet sonarscanner end /d:sonar.token="96776fa54a595ed6a86cfb00e41cf351b5af5c0e"
